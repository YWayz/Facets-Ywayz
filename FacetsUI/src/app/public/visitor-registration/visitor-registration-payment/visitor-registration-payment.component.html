<facets-block-ui [isBlocked]="isBlocked"></facets-block-ui>
<section class="container">
    <div class="free-charge" *ngIf="totalFinalAmount == 0">
        <img src="../../../../../assets/images/free-of-charge.png">
        <h2> Your entry for this event is free. No payment is required</h2>
    </div>
    <div class="payment mt-4" *ngIf="totalFinalAmount != 0">
        <p>Amount for the pass of event: LKR {{ finalAmount | number:'1.2' }}</p>
        <p>Amount for the pass of pavilions: LKR {{ totalPavilionAmount | number:'1.2' }}</p>
        <p>Total Amount to pay LKR: {{ totalFinalAmount | number:'1.2' }}</p>
        <!-- <button type="button" class="btn btn-primary mr-1" (click)="save()" [disabled]="isDisableButton">
            <i *ngIf="isDisableButton" class="spinner-border spinner-border-sm me-2"></i>
            Pay now</button> -->
            <div class="form-group">
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="consentCheck"
                    [(ngModel)]="isConsentGiven"
                    name="consentCheck"
                    (change)="onConsentChange()"
                  />
                  <label class="form-check-label" for="consentCheck">
                    <p style=" max-width: 36em;
                    margin: 0 auto;
                    background-color: white;
                    color: #5e6977;
                    font-size: 16px;">I hereby give my consent to Facets International Gem and Jewellery Show 2025 and Sri Lanka Gem and Jewellery Association for the processing of my above personal data for the event registration, sharing with Facets 2025 sponsors and trade partners for their respective offers, promotions, and prospective business opportunities.</p>
                  </label>
                </div>
              </div>
              <div class="d-flex justify-content-end">
            <button *ngIf="paymentSettingsModel.payLaterForOnlineRegistration == true" type="button" class="btn btn-primary" (click)="payAtCounter()" [disabled]=" !isConsentGiven || isDisableButton" style="margin-right: 12px;">
                    <i *ngIf="isDisableButtonForPayLater" class="spinner-border spinner-border-sm me-2"></i>
                    Pay at Event</button>
            <button type="button" class="btn btn-primary mr-1" (click)="save()" [disabled]="!isConsentGiven || isDisableButton">
                <i *ngIf="isDisableButton" class="spinner-border spinner-border-sm me-2"></i>
                Pay now</button>
            </div>
        <!-- <button *ngIf="paymentSettingsModel.payLaterForOnlineRegistration == true" type="button" class="btn btn-primary" (click)="payAtCounter()" [disabled]=" !isConsentGiven || isDisableButton">
            <i *ngIf="isDisableButtonForPayLater" class="spinner-border spinner-border-sm me-2"></i>
            Pay at Event</button> -->
        
    </div>

    <div class="action-footer mt-4">
        <button type="button" class="btn btn-light mr-2" (click)="back()">Back</button>
        <button *ngIf="totalFinalAmount == 0" type="button" class="btn btn-primary" (click)="save()"
            [disabled]="isDisableButton">
            <i *ngIf="isDisableButton" class="spinner-border spinner-border-sm me-2"></i>Next</button>
    </div>
</section>
