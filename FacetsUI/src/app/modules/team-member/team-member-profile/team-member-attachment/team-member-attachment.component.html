<facets-block-ui [isBlocked]="isBlocked"></facets-block-ui>
<div class="container">
    <div class="row">
        <div class="col">
            <facets-attachment-nic-passport
                [facetsAuthorization]="[superAdminPermissions.all, teamMemberRegistrationPermissions.viewAttachments]"
                [fileDatas]="nicFileDatas" (fileEmitter)="getNICFiles($event)" [teamMemberId]="teamMemberId!"
                [nicFileModels]="nicFileModels" [isUpdated]="true"></facets-attachment-nic-passport>

            <facets-attachment-other (fileEmitter)="getOtherFiles($event)"
                [facetsAuthorization]="[superAdminPermissions.all, teamMemberRegistrationPermissions.viewAttachments]"
                [fileDatas]="otherFileDatas" [teamMemberId]="teamMemberId!" [otherFileModels]="otherFileModels"
                [isUpdated]="true"></facets-attachment-other>
            <button type="button" class="btn btn-primary" (click)="uploadNicImage(teamMemberId!)" *ngIf="nicFileList.length > 0 || otherFileDatas.length > 0"
                [facetsAuthorization]="[superAdminPermissions.all, teamMemberRegistrationPermissions.update]"
                [facetsAuthorization]="[superAdminPermissions.all, teamMemberRegistrationPermissions.register]">Upload</button>
        </div>
    </div>
</div>
