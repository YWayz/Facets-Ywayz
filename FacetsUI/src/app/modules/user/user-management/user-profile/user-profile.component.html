<facets-block-ui [isBlocked]="isBlocked"></facets-block-ui>
<section class="container">
    <div class="info-card">
        <div class="card-h container-fluid">
            <div class="sub-head">Personal Information</div>
        </div>
        <hr>
        <form [formGroup]="userForm">
            <div class="card-b">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-lg-9 col-md-8 col-sm-12">
                            <div class="row">
                                <div class="col-lg-6 col-md-6 col-sm-12">
                                    <div class="form-group w-100">
                                        <label>First Name</label>
                                        <input class="form-control" placeholder="Ex. James "
                                            formControlName="firstName">
                                    </div>
                                </div>
                                <div class="col-lg-6 col-md-6 col-sm-12">
                                    <div class="form-group w-100">
                                        <label>Last Name</label>
                                        <input class="form-control" placeholder="Ex. Fin" formControlName="lastName">
                                    </div>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-lg-6 col-md-6 col-sm-12">
                                    <div class="form-group w-100">
                                        <label>Username</label>
                                        <input class="form-control" placeholder="Ex. James Fin"
                                            formControlName="userName">
                                    </div>
                                </div>
                                <div class="col-lg-6 col-md-6 col-sm-12">
                                    <div class="form-group w-100">
                                        <label>Email</label>
                                        <input class="form-control" placeholder="Ex. email@email.com"
                                            formControlName="email" [disabled]="true">
                                    </div>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-lg-6 col-md-6 col-sm-12">
                                    <div class="form-group w-100">
                                        <label>User Role</label>
                                        <input class="form-control" placeholder="Role" formControlName="roles"
                                            [disabled]="true">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-3 col-md-4 col-sm-12">
                            <div class="image">
                                <img *ngIf="!isEdit" [src]="user.imageURL" height="248px">
                            </div>
                            <div class="row" *ngIf="isEdit">
                                <div class="col">
                                    <div class="upload-card">
                                        <facets-image-attachment-capture [imagePath]="user.imageURL"
                                            (getfiles)="getFiles($event)"></facets-image-attachment-capture>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="action-footer mt-4">
                        <button type="button" class="btn btn-primary" *ngIf="!isEdit" (click)="edit()">Edit</button>
                        <button type="button" class="btn btn-light mr-2" *ngIf="isEdit" (click)="discard()">Discard</button>
                        <button type="button" class="btn btn-primary" *ngIf="isEdit"
                        (click)="updateProfile()">Update</button> 
                    </div>
                </div>
            </div>
        </form>
    </div>
</section>
<section class="container">
    <div class="info-card" *ngIf="isEdit">
        <form [formGroup]="passwordForm">
            <div class="card-b">
                <div class="container-fluid">
                    <div class="row">
                        <div class="col-lg-12 col-md-12 col-sm-12">
                            <div class="row mt-3" *ngIf="isEdit">
                                <div class="col-lg-6 col-md-6 col-sm-12">
                                    <div class="form-group w-100">
                                        <label>Current Password</label>
                                        <input type="password" class="form-control" placeholder="*********"
                                            formControlName="currentPassword">
                                    </div>
                                    <div class="danger" *ngIf="validationModel.displayMessage.currentPassword">
                                        {{validationModel.displayMessage.currentPassword}}
                                    </div>
                                </div>
                                <div class="col-lg-6 col-md-6 col-sm-12">
                                    <div class="form-group w-100">
                                        <label>New Password</label>
                                        <input type="password" class="form-control" placeholder="*********"
                                            formControlName="newPassword">
                                    </div>
                                    <div class="danger" *ngIf="validationModel.displayMessage.newPassword">
                                        {{validationModel.displayMessage.newPassword}}
                                    </div>
                                </div>
                                <div class="col-lg-6 col-md-6 col-sm-12">
                                    <div class="form-group w-100">
                                        <label>Confirm Password</label>
                                        <input type="password" class="form-control" placeholder="*********"
                                            formControlName="confirmPassword">
                                    </div>
                                    <div class="danger" *ngIf="validationModel.displayMessage.confirmPassword">
                                        {{validationModel.displayMessage.confirmPassword}}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="action-footer mt-4">
                        <button type="button" class="btn btn-light mr-2" *ngIf="isEdit"
                        (click)="discard()">Discard</button>
                        <button type="button" class="btn btn-primary" *ngIf="isEdit"
                        (click)="updateChangePassword()">Change Password</button> 
                    </div>
                </div>
            </div>
        </form>
    </div>
</section>
