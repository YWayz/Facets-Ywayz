<facets-block-ui [isBlocked]="isBlocked"></facets-block-ui>

<form [formGroup]="resetPasswordLinkForm">
    <div class="body">
        <div class="box">
            <div class="log">
                <img src="../../../../assets/images/logo.svg" alt="Sri Lanka Gem and Jewellery Association" width="280"
                    height="100">
            </div>
            <div class="container">
                <div class="head">
                    <div class="title-head">Reset password</div>
                </div>
                <div class="form w-100 mt-3">
                    <div class="pass-form w-100">
                        <div class="form w-100">
                            <label class="form__label">Email/Username</label>
                            <input class="form-control" placeholder=" " formControlName="email" autocomplete="off">
                            <mat-error *ngIf="validationModel.displayMessage.email">
                                {{validationModel.displayMessage.email}}
                            </mat-error>
                        </div>
                    </div>
                </div>

                <div class="input-field mt-4">
                    <button type="button" class="submit mt-2" (click)="sendResetEmail()">
                        Submit
                    </button>
                    <button type="button" class="submit-2 mt-2" (click)="navigateHome()">
                        Back
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
