<header>
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a (click)="goToVisitors()" class="link">View All Visitors</a></li>
            <li class="breadcrumb-item active" aria-current="page">{{fullName}}</li>
        </ol>
    </nav>
</header>
<mat-tab-group>
    <mat-tab label="Profile">
        <ng-template matTabContent>
            <facets-visitor-view-profile (sendFullName)="fullName = $event"></facets-visitor-view-profile>
        </ng-template>
    </mat-tab>
    <mat-tab label="Pass">
        <ng-template matTabContent>
            <facets-visitor-view-pass></facets-visitor-view-pass>
        </ng-template>
    </mat-tab>
    <mat-tab label="Images/Attachments">
        <ng-template matTabContent>
            <facets-visitor-view-attachment></facets-visitor-view-attachment>
        </ng-template>
    </mat-tab>
    <mat-tab label="Activity">
        <ng-template matTabContent>
            <facets-visitor-view-activity></facets-visitor-view-activity>
        </ng-template>
    </mat-tab>
</mat-tab-group>
