<facets-block-ui [isBlocked]="isBlocked"></facets-block-ui>
<div class="container">
    <table class="table">
        <tr class="table-head">
            <th>Description</th>
        </tr>
        <tbody *ngFor="let visitorActivity of visitorActivities">
            <td>{{ visitorActivity.description}}</td>            
        </tbody>
    </table>
    <facets-no-records [items]="visitorActivities"></facets-no-records>
    <div class="page-footer">
        <mat-paginator [length]="searchModel.totalRecords" [pageSize]="searchModel.pageSize" (page)="pageChanged($event)"
        [pageSizeOptions]="pageSizeOptions" aria-label="Select page" [showFirstLastButtons]="true">
        </mat-paginator> 
    </div>
</div>
