<facets-block-ui [isBlocked]="isBlocked"></facets-block-ui>
<div class="container">
    <div class="row">
        <div class="col">
            <facets-attachment-nic-passport [isUpdated]="true" [nicFileModels]="nicFileModels" [visitorId]="visitorId" [fileDatas]="nicFileDatas" (fileEmitter)="getNICFiles($event)"></facets-attachment-nic-passport>
            <facets-attachment-other [isUpdated]="true" [otherFileModels]="otherFileModels" [visitorId]="visitorId" [fileDatas]="otherFileDatas" (fileEmitter)="getOtherFiles($event)"></facets-attachment-other>
            <button type="button" class="btn btn-primary" (click)="saveAttachment()" *ngIf="nicFileList.length > 0 || otherFileDatas.length > 0">Upload</button>
        </div>
    </div>
</div>
