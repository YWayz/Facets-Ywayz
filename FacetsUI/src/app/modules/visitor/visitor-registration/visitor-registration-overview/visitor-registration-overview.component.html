<header>
    <h3>New Registration</h3>
</header>
<div class="progress-bar">
    <ul class="list-unstyled multi-steps">
        <li *ngIf="!hasCounterAssigned" [ngClass]="{'is-active': isCounterSelection == true}">Counter</li>
        <li [ngClass]="{'is-active': isProfile == true}">Profile</li>
        <li [ngClass]="{'is-active': isAttachment == true}">Attachments</li>
        <li [ngClass]="{'is-active': isPass == true}">Pass</li>
        <li *ngIf="isPavilionSessionExist" [ngClass]="{'is-active': isPavilion == true}">Pavilions</li>
        <li [ngClass]="{'is-active': isPayment == true}">Payment</li>
        <li [ngClass]="{'is-active': isRegistrationSuccess == true}">Registered</li>
    </ul>
</div>

<facets-visitor-registration-counter [isRegistrationCounter]="isCounterSelection" (isProfile)="goToProfile()"
    *ngIf="isCounterSelection"></facets-visitor-registration-counter>
<facets-visitor-registration-profile [visitorId]="visitorId" [isOtp]="isOtp"
    (sendDataForPassCategory)="setPassCategoryData($event)" (isRegistrationCounter)="goToRegistrationCounter()"
    (isAttachment)="goToAttachment($event)" *ngIf="isProfile"></facets-visitor-registration-profile>
<facets-visitor-registration-attachments [visitorId]="visitorId" (isProfile)="goToProfile($event)"
    (isPass)="goToPass($event)" *ngIf="isAttachment"></facets-visitor-registration-attachments>
<facets-visitor-registration-pass [isPavilionSessionExist]="isPavilionSessionExist" [selectedPassCategories]="selectedPassCategories" [visitorId]="visitorId" (isAttachment)="goToAttachment($event)" (isPayment)="isPavilionSessionExist ? goToPavilion() : goToPayment()" (sendFinalAmount)="setPayment($event)" *ngIf="isPass"></facets-visitor-registration-pass>
<facets-visitor-registration-pavilion (isPass)="goToPaymentBack()" (isPayment)="goToPayment()" [isPavilion]="isPavilion" [visitorId]="visitorId" *ngIf="isPavilion"></facets-visitor-registration-pavilion>
<facets-visitor-registration-payment [isPavilionSessionExist]="isPavilionSessionExist" [finalAmount]="finalAmount" [visitorId]="visitorId" (isPass)="isPavilionSessionExist ? goToPavilion() : goToPaymentBack()" (isRegisterSuccess)="goToRegisterSuccess()"
    *ngIf="isPayment"></facets-visitor-registration-payment>
<facets-visitor-registration-success *ngIf="isRegistrationSuccess"></facets-visitor-registration-success>
